[project]
name = "llm-web-tester"
version = "0.1.0"
description = "LLM-driven website testing through the Playwright MCP server"
requires-python = ">=3.11"
dependencies = [
  "mcp>=1.0",
  "pydantic>=2.5",
  "pyyaml>=6.0",
  "rich>=13.0",
  "httpx>=0.27",
  "starlette>=0.37",   # live viewer server (also a dependency of mcp)
  "uvicorn>=0.29",
]

[tool.setuptools]
packages = ["src", "src.llm", "src.live"]

[tool.setuptools.package-data]
"src.live" = ["static/*.html"]
